name: Build ARM64 standalone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 确认运行的是v3版工作流
        run: echo "workflow v3 - npm install pnpm"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: 用npm安装pnpm 10.28.0
        run: |
          npm install -g pnpm@10.28.0
          which pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf openmaic-standalone-arm64.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: openmaic-standalone-arm64
          path: openmaic-standalone-arm64.tar.gz
          retention-days: 14
