# 在 GitHub 公共仓库的免费 ARM64 原生 runner 上构建生产部署包。
# 用法: Actions 页运行 "Build ARM64 standalone"
#       → 从 Artifacts 下载 openmaic-standalone-arm64.tar.gz
name: Build ARM64 standalone

on:
  workflow_dispatch:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      # 与项目 Dockerfile 相同的方式安装 pnpm(匹配 package.json 锁定的 10.28.0)
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf openmaic-standalone-arm64.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: openmaic-standalone-arm64
          path: openmaic-standalone-arm64.tar.gz
          retention-days: 14
