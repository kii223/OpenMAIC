name: Build ARM64 standalone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 确认v4版工作流(pnpm在setup-node之前)
        run: echo "workflow v4 - action-setup before setup-node"

      - uses: actions/checkout@v5

      # 关键: 必须在 setup-node 之前安装 pnpm, 且不写 version(避免与 package.json 冲突)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: 验证版本
        run: |
          pnpm --version
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf openmaic-standalone-arm64.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: openmaic-standalone-arm64
          path: openmaic-standalone-arm64.tar.gz
          retention-days: 14
